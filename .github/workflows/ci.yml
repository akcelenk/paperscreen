name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"   # no torch: tests use the offline hashing embedder
      - run: ruff check src tests
      - run: mypy src
      - run: python -m pytest --cov=paperscreen --cov-report=term-missing --cov-fail-under=85
      - run: paperscreen demo --workdir demo_run --days 28 && cat demo_run/monitor.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t paperscreen:ci .
      - name: container starts and answers
        run: |
          docker run -d --name ps -p 127.0.0.1:8765:8765 paperscreen:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/state && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/state | grep -q '"interests"'
          docker logs ps
