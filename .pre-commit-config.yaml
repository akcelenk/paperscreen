repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: no-personal-data
        name: never commit labels or databases
        entry: personal data files must not be committed
        language: fail
        files: '(\.sqlite|config\.yaml|^data/|^digests/|^reports/|^models/)'
        exclude: '^(docker/config\.yaml|\.pre-commit-config\.yaml|src/paperscreen/default_config\.yaml)$'
