[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperscreen"
version = "0.2.0"
description = "Personal research-paper screening and ranking with a leakage-aware evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "requests>=2.31",
    "click>=8.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "transformers>=4.40", "torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-requests", "pre-commit>=3.7"]

[project.scripts]
paperscreen = "paperscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperscreen = ["default_config.yaml", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["paperscreen"]
omit = ["*/embeddings.py"]   # the transformer backends need torch and network; the hashing path is tested

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP007", "UP045"]
